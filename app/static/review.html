<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product review</title>
<style>
  /* Light palette on bare :root so nothing depends on a media query. */
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --ink: #11151c;
    --ink-dim: #5a6472;
    --line: #d7dce4;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --ok: #0f7a3d;
    --ok-bg: #e4f4ea;
    --warn: #8a5a00;
    --warn-bg: #fdf0d5;
    --bad: #a3302a;
    --bad-bg: #fbe6e4;
    --active: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216;
      --panel: #171c22;
      --panel-2: #1f252d;
      --ink: #e8ecf2;
      --ink-dim: #9aa5b4;
      --line: #2a323c;
      --accent: #4b8bff;
      --accent-ink: #0b0e12;
      --ok: #6ee7a0;
      --ok-bg: #12301f;
      --warn: #f3c969;
      --warn-bg: #33280d;
      --bad: #ff9a92;
      --bad-bg: #351715;
      --active: #4b8bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 6rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: .75rem 1rem; display: flex; flex-wrap: wrap;
    gap: .75rem 1.25rem; align-items: baseline;
  }
  h1 { font-size: 1rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .stats { display: flex; flex-wrap: wrap; gap: .25rem 1rem; color: var(--ink-dim); font-size: .85rem; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1 1 auto; }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid transparent;
    border-radius: 10px; padding: .9rem 1rem; margin: 0 0 .75rem;
  }
  .card.active { border-left-color: var(--active); }
  .card.done { opacity: .45; }
  .card h2 { margin: 0 0 .15rem; font-size: 1.05rem; font-weight: 650; }
  .meta { color: var(--ink-dim); font-size: .85rem; margin-bottom: .6rem; }

  .attrs { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
  .attrs label {
    display: inline-flex; align-items: center; gap: .35rem;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: .2rem .6rem; font-size: .85rem; cursor: pointer;
    user-select: none;
  }
  .attrs input { margin: 0; accent-color: var(--accent); }
  .attrs label.on { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

  .clears { font-size: .85rem; margin: .4rem 0 .6rem; }
  .pill {
    display: inline-block; background: var(--ok-bg); color: var(--ok);
    border-radius: 999px; padding: .1rem .55rem; font-size: .8rem; margin-right: .3rem;
  }
  .pill.none { background: var(--bad-bg); color: var(--bad); }

  .alarm {
    background: var(--warn-bg); color: var(--warn);
    border-radius: 8px; padding: .5rem .7rem; font-size: .85rem; margin: .5rem 0;
  }
  .reason { color: var(--ink-dim); font-size: .85rem; font-style: italic; margin: .3rem 0 .5rem; }

  ul.aliases { margin: .4rem 0 .7rem; padding: 0; list-style: none; max-height: 13rem; overflow-y: auto; }
  ul.aliases li {
    font-size: .85rem; padding: .18rem 0; border-bottom: 1px dashed var(--line);
  }
  .aliasrow { display: flex; gap: .5rem; align-items: center; }
  .tile {
    margin: .2rem 0 .4rem 2.7rem; padding: .35rem .55rem;
    background: var(--panel-2); border-radius: 6px;
    font-size: .8rem; color: var(--ink-dim);
  }
  .tile b { color: var(--ink); font-weight: 600; }
  .sib {
    display: inline-block; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 .45rem; margin: .15rem .2rem 0 0;
    color: var(--ink);
  }
  .sib.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  ul.aliases li:last-child { border-bottom: 0; }
  ul.aliases code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
  .seen { color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 2.2rem; }
  .drop { margin-left: auto; color: var(--ink-dim); cursor: pointer; border: 0; background: none; font-size: .9rem; padding: 0 .25rem; }
  .drop:hover { color: var(--bad); }
  li.dropped code { text-decoration: line-through; opacity: .5; }

  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); padding: .4rem .8rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--bad); }
  kbd {
    font-family: ui-monospace, monospace; font-size: .75rem;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 .3rem;
  }
  .note { color: var(--ink-dim); font-size: .85rem; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-dim); }
  #toast {
    position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .5rem .9rem; font-size: .9rem; box-shadow: 0 6px 24px rgb(0 0 0 / .18);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 34rem) { .stats { font-size: .8rem; } main { padding: .6rem; } }
</style>
</head>
<body>
<header>
  <h1>Product review</h1>
  <div class="stats" id="stats"></div>
  <span class="spacer"></span>
  <span class="note"><kbd>y</kbd> confirm &middot; <kbd>n</kbd> reject &middot; <kbd>s</kbd> skip &middot; <kbd>j</kbd>/<kbd>k</kbd> move</span>
  <button id="link">Link to deals</button>
</header>

<main id="main"><p class="empty">Loading&hellip;</p></main>
<div id="toast"></div>

<script>
"use strict";

// One decision per product applies to every flyer string under it. The
// dietary judgement is a property of the product, which is what makes
// batching it safe -- confirming "milk contains dairy" once is not weaker
// than confirming it fifteen times.
const state = { groups: [], orphans: [], attributes: [], stats: {}, active: 0 };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

const ATTR_LABEL = {
  contains_meat: "meat",
  contains_fish: "fish/shellfish",
  contains_dairy: "dairy",
  contains_egg: "egg",
  contains_nuts: "nuts",
};

// Mirrors app/services/products.RESTRICTION_ATTRIBUTES so the "clears" line
// updates as you toggle, without a round trip. The server recomputes it from
// the same table on save, so this is a preview and never the authority.
const RESTRICTION_ATTRS = {
  vegan: ["contains_meat", "contains_fish", "contains_dairy", "contains_egg"],
  vegetarian: ["contains_meat", "contains_fish"],
  pescatarian: ["contains_meat"],
  no_nuts: ["contains_nuts"],
};

function clearsFor(group) {
  return Object.keys(RESTRICTION_ATTRS).filter(
    (label) => !RESTRICTION_ATTRS[label].some((a) => group[a])
  );
}

async function load() {
  const res = await fetch("/admin/products/queue");
  if (!res.ok) {
    $("#main").innerHTML = `<p class="empty">Could not load the queue (${res.status}).</p>`;
    return;
  }
  const data = await res.json();
  state.groups = data.groups.map((g) => ({ ...g, decided: null, dropped: new Set() }));
  state.orphans = data.orphans;
  state.attributes = data.attributes;
  state.stats = data.stats;
  state.active = 0;
  render();
}

function renderStats() {
  const s = state.stats;
  $("#stats").innerHTML = [
    `pending <b>${s.proposed ?? 0}</b>`,
    `confirmed <b>${s.confirmed ?? 0}</b>`,
    `rejected <b>${s.rejected ?? 0}</b>`,
    `products <b>${s.products_confirmed ?? 0}</b>`,
    `deals linked <b>${s.deals_linked ?? 0}</b>/<b>${s.deals_total ?? 0}</b>`,
  ].join("");
}

function groupCard(group, index) {
  const clears = clearsFor(group);
  const attrs = state.attributes.map((attr) => `
    <label class="${group[attr] ? "on" : ""}">
      <input type="checkbox" data-attr="${attr}" data-i="${index}"
             ${group[attr] ? "checked" : ""}>
      ${esc(ATTR_LABEL[attr] || attr)}
    </label>`).join("");

  const aliases = group.aliases.map((a) => {
    // A multi-product tile: this one string is shared across several product
    // groups. Without saying so, the reviewer sees the whole tile text under
    // one product and reasonably concludes the split never happened.
    const others = (a.tile_products || []).filter(
      (n) => n !== group.canonical_name
    );
    const tile = others.length ? `
      <div class="tile">
        <b>Part of a ${a.tile_products.length}-product tile.</b>
        The rest of this string is handled by:
        ${others.map((n) => `<span class="sib">${esc(n)}</span>`).join("")}
        ${a.price_is_per_item === false
          ? '<span class="sib warn">bundle price &mdash; not this item&rsquo;s own price</span>'
          : ""}
        ${a.price_is_per_item === null
          ? '<span class="sib warn">pricing undecided &mdash; stays withheld</span>'
          : ""}
      </div>` : "";
    return `
    <li class="${group.dropped.has(a.alias_id) ? "dropped" : ""}">
      <div class="aliasrow">
        <span class="seen">&times;${a.times_seen}</span>
        <code>${esc(a.raw_example)}</code>
        <button class="drop" data-drop="${a.alias_id}" data-i="${index}"
                title="this string is not this product">&#10007;</button>
      </div>
      ${tile}
    </li>`;
  }).join("");

  const alarm = (group.oracle_disagreement || []).length ? `
    <div class="alarm"><b>The substring oracle disagrees</b> for
      ${esc(group.oracle_disagreement.join(", "))}. It is usually the oracle that is
      wrong &mdash; that is why these attributes exist &mdash; but check the labels
      against the name before confirming.</div>` : "";

  const reason = group.aliases.find((a) => a.proposal_reason);
  const kept = group.aliases.length - group.dropped.size;

  return `
  <section class="card ${index === state.active ? "active" : ""} ${group.decided ? "done" : ""}"
           data-i="${index}">
    <h2>${esc(group.canonical_name)}</h2>
    <div class="meta">
      ${esc(group.category)} &middot; ${group.aliases.length} string(s), seen
      ${group.times_seen}&times; &middot; product is ${esc(group.product_status)}
      ${group.is_pantry_staple ? " &middot; pantry staple" : ""}
    </div>
    <div class="attrs">${attrs}</div>
    <div class="clears">clears:
      ${clears.length
        ? clears.map((c) => `<span class="pill">${esc(c)}</span>`).join("")
        : '<span class="pill none">none of them</span>'}
    </div>
    ${alarm}
    ${reason ? `<div class="reason">${esc(reason.proposal_reason)}</div>` : ""}
    <ul class="aliases">${aliases}</ul>
    <div class="row">
      <button class="primary" data-act="confirm" data-i="${index}">
        Confirm${kept !== group.aliases.length ? ` ${kept} of ${group.aliases.length}` : ""}
      </button>
      <button class="danger" data-act="reject" data-i="${index}">Reject all</button>
      <button data-act="skip" data-i="${index}">Skip</button>
      ${group.decided ? `<span class="note">${esc(group.decided)}</span>` : ""}
    </div>
  </section>`;
}

function orphanCard() {
  if (!state.orphans.length) return "";
  const rows = state.orphans.map((a) => `
    <li><span class="seen">&times;${a.times_seen}</span>
        <code>${esc(a.raw_example)}</code></li>`).join("");
  return `
  <section class="card">
    <h2>${state.orphans.length} string(s) with no product</h2>
    <div class="meta">Multi-product flyer tiles and garbled copy</div>
    <p class="note">
      One tile advertising several products at one price, e.g.
      <code>ANNIE'S SHELLS &amp; CHEDDAR 170 G BEATRICE CHOCOLATE MILK 1 L
      GOLDFISH CRACKERS 168 - 227 G</code>. Splitting these into separate deals is
      recorded as debt in <code>ROADMAP.md</code>; until then they cannot be priced
      or matched. Rejecting withholds them permanently and stops them re-queueing
      every week.
    </p>
    <ul class="aliases">${rows}</ul>
    <div class="row">
      <button class="danger" id="reject-orphans">Reject all ${state.orphans.length}</button>
    </div>
  </section>`;
}

function render() {
  renderStats();
  const pending = state.groups.filter((g) => !g.decided);
  if (!pending.length && !state.orphans.length) {
    $("#main").innerHTML = `
      <p class="empty">Nothing left to review.<br>
      <button class="primary" id="link2">Link to deals</button></p>`;
    const btn = $("#link2");
    if (btn) btn.addEventListener("click", runLink);
    return;
  }
  $("#main").innerHTML =
    state.groups.map((g, i) => groupCard(g, i)).join("") + orphanCard();
  const ro = $("#reject-orphans");
  if (ro) ro.addEventListener("click", rejectOrphans);
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = res.status;
    try { detail = (await res.json()).detail ?? detail; } catch (_) { /* keep status */ }
    throw new Error(detail);
  }
  return res.json();
}

async function decide(index, action) {
  const group = state.groups[index];
  if (!group || group.decided) return;

  const ids = group.aliases
    .map((a) => a.alias_id)
    .filter((id) => !group.dropped.has(id));

  if (action === "confirm" && !ids.length) {
    toast("every string here is dropped - use Reject all instead");
    return;
  }

  const attributes = {};
  state.attributes.forEach((attr) => { attributes[attr] = !!group[attr]; });

  try {
    if (action === "confirm") {
      const dropped = [...group.dropped];
      const out = await post("/admin/products/decide", {
        product_id: group.product_id, alias_ids: ids,
        action: "confirm", attributes,
      });
      // Strings the reviewer struck out are rejected, not left pending --
      // otherwise they come back next week looking like a fresh proposal.
      if (dropped.length) {
        await post("/admin/products/decide", {
          product_id: group.product_id, alias_ids: dropped, action: "reject",
        });
      }
      state.stats = out.stats;
      group.decided = `confirmed ${out.decided}` +
        (dropped.length ? `, rejected ${dropped.length}` : "");
    } else {
      const out = await post("/admin/products/decide", {
        product_id: group.product_id,
        alias_ids: group.aliases.map((a) => a.alias_id),
        action: "reject",
      });
      state.stats = out.stats;
      group.decided = `rejected ${out.decided}`;
    }
    toast(`${group.canonical_name}: ${group.decided}`);
  } catch (err) {
    toast(`failed: ${err.message}`);
    return;
  }
  advance();
  render();
}

async function rejectOrphans() {
  try {
    const out = await post("/admin/products/decide", {
      alias_ids: state.orphans.map((a) => a.alias_id), action: "reject",
    });
    state.stats = out.stats;
    state.orphans = [];
    toast(`rejected ${out.decided} unplaceable string(s)`);
    render();
  } catch (err) {
    toast(`failed: ${err.message}`);
  }
}

async function runLink() {
  try {
    const out = await post("/admin/products/link", {});
    state.stats = out.stats;
    toast(`linked ${out.link.linked_deals} deal(s), ` +
          `${out.link.linked_snapshots} snapshot(s); ` +
          `${out.link.unmapped} name(s) still unmapped`);
    render();
  } catch (err) {
    toast(`link failed: ${err.message}`);
  }
}

function advance() {
  const next = state.groups.findIndex((g, i) => i > state.active && !g.decided);
  state.active = next === -1
    ? state.groups.findIndex((g) => !g.decided)
    : next;
  if (state.active === -1) state.active = 0;
}

function move(delta) {
  const n = state.groups.length;
  if (!n) return;
  state.active = (state.active + delta + n) % n;
  render();
  const card = document.querySelector(`.card[data-i="${state.active}"]`);
  if (card) card.scrollIntoView({ block: "center", behavior: "smooth" });
}

document.addEventListener("click", (event) => {
  const act = event.target.closest("[data-act]");
  if (act) {
    const i = Number(act.dataset.i);
    if (act.dataset.act === "skip") { state.active = i; advance(); render(); }
    else decide(i, act.dataset.act);
    return;
  }
  const drop = event.target.closest("[data-drop]");
  if (drop) {
    const group = state.groups[Number(drop.dataset.i)];
    const id = Number(drop.dataset.drop);
    if (group.dropped.has(id)) group.dropped.delete(id);
    else group.dropped.add(id);
    render();
    return;
  }
  const card = event.target.closest(".card[data-i]");
  if (card) { state.active = Number(card.dataset.i); render(); }
});

document.addEventListener("change", (event) => {
  const box = event.target.closest("[data-attr]");
  if (!box) return;
  const group = state.groups[Number(box.dataset.i)];
  group[box.dataset.attr] = box.checked;
  render();
});

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, textarea") || event.metaKey || event.ctrlKey) return;
  const key = event.key.toLowerCase();
  if (key === "y") { event.preventDefault(); decide(state.active, "confirm"); }
  else if (key === "n") { event.preventDefault(); decide(state.active, "reject"); }
  else if (key === "s") { event.preventDefault(); advance(); render(); }
  else if (key === "j" || key === "arrowdown") { event.preventDefault(); move(1); }
  else if (key === "k" || key === "arrowup") { event.preventDefault(); move(-1); }
});

$("#link").addEventListener("click", runLink);
load();
</script>
</body>
</html>
